name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Shorts Thumbnail Studio" "com.shorts.thumbnailstudio" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Enable Internet & Gallery Permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" /><application|' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-Thumbnail-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
